name: VERITAS Compliance and Safety

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  veritas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest ruff
      - name: Verify policy integrity
        run: python scripts/veritas_gate.py --check-policies
      - name: Verify PR diff and metadata
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          VERITAS_DIFF_BASE="origin/${{ github.base_ref }}" python scripts/veritas_gate.py --verify-diff --verify-metadata --role auto
      # ZOO-21: gate 10 is regenerated fresh and verified every run, so CI
      # always measures the CURRENT tree rather than trusting a committed
      # artifact. The artifact stays committed so human review can diff it;
      # the regeneration is what makes CI's verdict independent of it.
      # --strict-traceability is deliberately NOT passed here: while
      # traceability_policy.mode is 'migration', unresolved synthetic ids in
      # the gate's own test files would fail every PR. Strict is the
      # post-migration posture, flipped together with coverage_enforcement.
      - name: Regenerate and verify traceability artifact (gate 10)
        run: |
          python scripts/traceability_runner.py
          python scripts/veritas_gate.py --verify-traceability
      - name: VERITAS gate — check-all + metadata (push gate)
        # Branch protection required check privat free tieren nem
        # elerheto, ezert ez a gate push-ra IS fut — nem csak PR-ban.
        # A local .githooks/pre-commit csak kenyelmi kontroll (--no-verify
        # megkeruli), a valodi kenyszer ez a CI-lepes.
        # Fugg: runner interface (scripts/veritas_gate.py).
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            export VERITAS_DIFF_BASE="origin/${{ github.base_ref }}"
          fi
          python scripts/veritas_gate.py --check-all --verify-metadata
      - name: Full deterministic regression gate
        run: python scripts/veritas_gate.py --run-suite
