# VERITAS 1.1 Quality Gates Configuration

gates:
  1_exploration_safety_gate:
    requires_disposable_flag: true
    forbids_production_write: true
    forbids_real_pii: true

  2_clean_room_promotion_gate:
    forbids_prototype_source_code: true
    forbids_prototype_lockfile: true
    requires_approved_spec: true
    requires_fresh_workspace: true

  3_change_readiness_gate:
    requires_problem_or_brief: true
    requires_path_classification: true

  4_spec_readiness_gate:
    require_human_approval_for_reverse_engineered_specs: true
    require_structured_requirement_ids: true
    require_acceptance_scenarios: true
    require_ui_api_contracts: true
    require_no_open_blocking_questions: true

  5_context_fitness_gate:
    maximum_relevant_code_lines: 700
    maximum_allowed_files: 6
    maximum_dependency_hops: 3
    maximum_architectural_boundaries: 2
    maximum_requirements: 3

  6_pre_test_safety_gate:
    enforce_allow_deny_patterns: true
    check_symlinks: true
    secret_scan: true
    reject_oversized_diff: true

  7_red_gate:
    require_failing_test_execution: true
    reject_missing_test_as_red: true
    require_structured_metadata: true

  8_targeted_green_gate:
    all_targeted_tests_must_pass: true
    reject_skipped_as_evidence: true

  9_full_regression_gate:
    require_full_regression: true
    require_lint_pass: true
    require_typecheck_pass: true
    require_build_pass: true

  10_traceability_gate:
    # ZOO-21: the runner EXISTS and the gate READS it. The first `require_*`
    # key below is now satisfied by a real artifact, and verify_traceability()
    # in scripts/veritas_gate.py fails when the artifact is missing, stale, or
    # shows a lost marker. Do not "simplify" this gate back into a declaration:
    # that unsatisfiable state is exactly what ZOO-18 had to document.
    #
    # The SECOND `require_*` key is still a TARGET, not a measurement. Real
    # marker coverage is 4.8% (89/1862) across both test trees at 4b5b4d5, not
    # 100%. The 100% is the migration's end state; the migration itself is
    # outstanding work on 134 files and is out of scope for this ticket.
    #
    # Why `enforcement_status` is still `not_enforced` even though a gate now
    # runs: `enforced` here means "the 100% target is enforced", and it is not.
    # What IS enforced is the ratchet — coverage cannot fall below
    # enforcement_floor_percent and no marker can be removed. Both facts are
    # recorded below rather than blurred into one word.
    require_runner_generated_traceability: true
    require_100_percent_requirement_coverage: true
    reject_missing_test_id: true
    enforcement_status: not_enforced
    enforced_now:
      # What the gate actually fails on today. See traceability_policy in
      # .ai/project-profile.yaml for the full rationale.
      - traceability_artifact_present
      - traceability_artifact_reproduces
      - no_marker_lost_versus_recorded
      - coverage_at_or_above_ratchet_floor
      - test_ids_unique
    measured:
      runner_generated_traceability: present
      artifact_path: ".agent-pipeline/audit/traceability.json"
      artifact_generator: "scripts/traceability_runner.py"
      # Measured by scripts/traceability_runner.py at f74abf9. These are the
      # runner's own numbers, not estimates: 480 of 1984 functions carry all
      # three markers (test_id, requirements, scenario).
      #
      # BOTH trees the runner scans are counted: tests/ AND
      # .agent-pipeline/03_e2e_suites/. The earlier ZOO-18 figure (89/1862 =
      # 4.8%) was computed by verify_test_metadata(), which scans a different
      # and smaller set — comparing the two was never meaningful.
      requirement_coverage:
        compliant: 480
        total: 1984
        percent: "24.2"
        measured_at_commit: f74abf9
        measured_by: "scripts/traceability_runner.py --json"
        by_test_tree:
          tests: {compliant: 480, total: 1568, percent: "30.6"}
          e2e: {compliant: 0, total: 416, percent: "0.0"}
      # Synthetic self-referential ids (FEAT-RL-V02-REQ-*, AC-RL-V02-*) in 2
      # test files, not broken links to real specs. Reported every run;
      # enforced only under --strict-traceability. This count (58) is NOT
      # the runner's spec_references.unresolved_count (750) — the runner
      # total is recorded as runner_spec_references_unresolved_count below.
      unresolved_synthetic_self_refs_strict_only: 58
      runner_spec_references_unresolved_count: 750
      duplicate_test_ids: 0
      # The marker gate is STILL delta-scoped; that is why the runner's
      # recorded-vs-live count comparison is the check that catches losses.
      enforcement_scope: delta_only_plus_artifact_ratchet
    gap_reference: ".ai/traceability-gap.md"

  11_execution_equivalence_gate:
    allow_cache_only_with_identical_inputs: true
    forbid_cache_for_security_and_auth: true
    forbid_cache_for_migrations: true

  12_independent_review_gate:
    require_independent_reviewer_approval: true
    max_review_rounds: 3

  13_final_safety_gate:
    scan_final_git_diff: true
    verify_provenance: true
    verify_no_leaked_secrets: true

  14_release_gate:
    require_closed_manifest: true
    require_rollback_plan: true

  15_process_proportionality_gate:
    track_control_overhead: true
    track_duplicate_verification: true
    forbid_automatic_constitutional_relaxations: true

repair_policy:
  max_patch_iterations: 5
  max_environment_retries: 1
  max_duration_minutes: 30
  on_limit_reached: preserve_and_escalate
  on_policy_violation: stop_and_quarantine
