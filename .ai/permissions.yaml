# VERITAS 1.1 Role-Based Permissions & Isolation
# Evaluation policy: default deny
# Receipts-lens paths: app/**, frontend/**, tests/**, frontend/e2e/**.

evaluation:
  default: deny
  resolve_symlinks: true
  disallow_parent_traversal: true
  enforce_clean_room_promotion: true

roles:
  product_authority:
    description: "Defines problems, requirements, priority and business outcomes."
    allow:
      - "specs/briefs/**"
      - "specs/problems/**"
      - ".agent-pipeline/01_problem_briefs/**"
    deny:
      - "app/**"
      - "frontend/**"
      - "tests/**"
      - ".ai/constitutional-policy.yaml"

  researcher:
    description: "Gathers evidence, benchmarks, alternatives, without approving requirements."
    allow:
      - "docs/research/**"
      - "specs/research/**"
    deny:
      - "app/**"
      - "frontend/**"
      - "tests/**"
      - "specs/features/**"
      - ".ai/**"

  spec_author:
    description: "Authors testable specifications, acceptance scenarios, UI/API contracts."
    allow:
      - "specs/**"
      - ".agent-pipeline/02_specs/**"
      - "docs/specs/**"
    deny:
      - "app/**"
      - "frontend/**"
      - "tests/**"
      - ".ai/constitutional-policy.yaml"

  architect:
    description: "Authors ADRs, system boundaries, invariants without overriding user outcomes."
    allow:
      - "docs/decisions/**"
      - "specs/domain/**"
    deny:
      - "app/**"
      - "frontend/**"
      - "tests/**"
      - ".ai/constitutional-policy.yaml"

  test_author:
    description: "Authors test suites, metadata annotations, and proves RED failure."
    allow:
      - "tests/**"
      - "frontend/e2e/**"
      - ".agent-pipeline/03_e2e_suites/**"
    deny:
      - "app/**"
      - "frontend/app/**"
      - "specs/**"
      - ".ai/**"

  implementer:
    description: "Produces minimal code to turn RED tests GREEN according to execution packet."
    allow:
      - "app/**"
      - "frontend/**"
    deny:
      - "tests/**"
      - "frontend/e2e/**"
      - "specs/**"
      - ".ai/**"
      - ".agent-pipeline/03_e2e_suites/**"

  reviewer:
    description: "Read-only audit of diffs, test evidence, specs and produces findings."
    allow:
      - ".ai-execution/reviews/**"
      - ".agent-pipeline/04_defects/**"
    deny:
      - "app/**"
      - "frontend/**"
      - "tests/**"
      - "specs/**"

  arbiter:
    description: "Resolves deadlocked technical disputes per policy or escalates to human."
    allow:
      - "docs/decisions/disputes/**"
    deny:
      - "app/**"
      - "tests/**"
      - ".ai/constitutional-policy.yaml"

  runner:
    description: "Deterministic command execution, state transitions, gate verdicts."
    allow:
      - ".ai-execution/**"
      - ".agent-pipeline/**"
    deny:
      - ".ai/constitutional-policy.yaml"

  human_authority:
    description: "Ultimate sign-off for R3/R4 changes, releases, and constitutional policy."
    allow:
      - "**"
    deny: []
