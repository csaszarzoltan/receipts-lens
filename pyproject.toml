[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "receiptslens"
version = "1.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110","uvicorn>=0.29","pydantic>=2.6","pillow>=10.3","pytesseract>=0.3","httpx>=0.27","python-multipart>=0.0.9","reportlab>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=8.2","ruff>=0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["E401", "E701", "E702"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841", "F401"]
