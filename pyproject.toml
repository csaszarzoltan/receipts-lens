[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "receiptslens"
version = "1.4.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110","uvicorn>=0.29","pydantic>=2.6","pillow>=10.3","pytesseract>=0.3","httpx>=0.27","python-multipart>=0.0.9","reportlab>=4.0","cryptography>=43"]

[project.optional-dependencies]
dev = ["pytest>=8.2","ruff>=0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["E401", "E701", "E702"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841", "F401"]
"tests/test_fetcher_wiring.py" = ["BLE001"]
"tests/test_security_egress_allowlist.py" = ["BLE001"]
"app/api_v2.py" = ["B008", "BLE001", "S110"]
"app/subscriptions_api.py" = ["B008"]
"app/auth_api.py" = ["B008"]
"app/api.py" = ["B008", "BLE001", "TRY004"]
"app/product_api.py" = ["B008"]
"app/batch.py" = ["BLE001"]
"app/cli.py" = ["BLE001"]
"app/ocr.py" = ["BLE001", "DTZ007", "I001", "S112", "PYI041"]
"app/normalization.py" = ["DTZ007"]
"app/inbox_service.py" = ["BLE001", "S110"]
"app/advanced_workspace.py" = ["BLE001"]
"app/categorizer.py" = ["BLE001"]
"app/credential_store.py" = ["BLE001"]
"app/preprocessing.py" = ["BLE001"]
"app/provider_export_service.py" = ["BLE001"]

[project.scripts]
receipts-lens = "app.cli:main"
